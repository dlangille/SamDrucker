# nginx configuration for the SamDrucker reporting website.
#
# The website shows which package versions every host runs, which tells a
# reader exactly which hosts are vulnerable to what. Keep it off the
# public internet: serve it on an internal name, allow only your own
# networks, and add a password if more than you can read it there.
#
# Serve it from its own server block, not the one that receives check-ins.

server {
    listen       443 ssl;
    server_name  samdrucker.int.example.org;

    ssl_certificate      /usr/local/etc/ssl/samdrucker.int.example.org.fullchain.cer;
    ssl_certificate_key  /usr/local/etc/ssl/samdrucker.int.example.org.key;

    # only your own networks
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    # and, optionally, a password; create the file with htpasswd
    # auth_basic           "SamDrucker";
    # auth_basic_user_file /usr/local/etc/nginx/samdrucker.htpasswd;

    # the www directory only; include/ sits beside it, outside the root
    root  /usr/local/www/samdrucker/web/www;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   unix:/var/run/php-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
