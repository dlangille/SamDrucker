# nginx configuration for the SamDrucker reporting website.
#
# The website shows which package versions every host runs, which tells a
# reader exactly which hosts are vulnerable to what. Keep it off the
# public internet: serve it on an internal name, allow only your own
# networks, and add a password if more than you can read it there.
#
# Serve it from its own server block and name, not the one that receives
# check-ins, and from its own directory: the FreeBSD port installs it in
# /usr/local/www/samdruckerweb, outside the check-in server's root
# (/usr/local/www/samdrucker), so it cannot be reached through that.

server {
    # Use the same listen address as your other server blocks. If they
    # listen on a specific address (192.0.2.10:443) and this one on 443
    # alone, nginx sends every request for that address to those blocks,
    # and this one never answers.
    listen       443 ssl;
    server_name  samdruckerweb.int.example.org;

    ssl_certificate      /usr/local/etc/ssl/samdruckerweb.int.example.org.fullchain.cer;
    ssl_certificate_key  /usr/local/etc/ssl/samdruckerweb.int.example.org.key;

    # logs of their own, so website requests are not mixed in with
    # check-ins. The FreeBSD port rotates /var/log/nginx/samdruckerweb*.log
    # with /usr/local/etc/newsyslog.conf.d/samdruckerweb.conf.
    access_log  /var/log/nginx/samdruckerweb.int.example.org-access.log combined;
    error_log   /var/log/nginx/samdruckerweb.int.example.org-error.log;

    # only your own networks
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    # and a password: a visitor must pass both checks. Create the password
    # file before reloading nginx; see "Passwords" in the README. Without
    # it, every request gets a 500 error.
    auth_basic           "SamDrucker";
    auth_basic_user_file /usr/local/etc/nginx/samdruckerweb.htpasswd;

    # the www directory only; include/ sits beside it, outside the root
    root  /usr/local/www/samdruckerweb/www;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   unix:/var/run/php-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
